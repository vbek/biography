# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Scripts are cached for hours but pages for minutes, so without this a browser can mix files from two deploys
      - name: Version the game files
        run: sed -E -i "s#(src|href)=\"(\.\./party/[^\"]+|rules\.js|game\.js|game\.css)\"#\1=\"\2?v=${GITHUB_SHA::8}\"#" games/ludo/index.html games/snakes-ladders/index.html games/grave-mistake/index.html
      - name: Version the Ask About Me widget
        run: sed -E -i "s#(src=\"(\.\./)?ask/ask\.js)\"#\1?v=${GITHUB_SHA::8}\"#" index.html tools/index.html games/index.html
      # Rebuild the Ask About Me knowledge base from the pages being deployed
      - name: Index site content for Ask About Me
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null || echo "poppler-utils unavailable; keeping committed résumé entries"
          node scripts/build-ask-index.mjs
      # Notes for the repo, not pages for visitors or search engines
      - name: Leave repo-only files out of the site
        run: rm -rf README.md .vscode games/party/README.md scripts
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
