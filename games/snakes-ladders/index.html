<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snakes &amp; Ladders — Bibek Koirala</title>
<meta name="description" content="Free Snakes and Ladders for 2 to 6 players with a new random board every game. Play on one device, or host a room and join with a QR code, room code or IP address.">
<script>
  try { if (localStorage.getItem('theme') !== 'dark') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-linecap='round'%3E%3Cpath d='M5 21C2 14 12 14 9 8S12 3 17 3' stroke='%2316a34a' stroke-width='3.5'/%3E%3Cpath d='M15 21l5-12M20 21l4-12' stroke='%23b45309' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../party/party.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="../index.html" title="Back to games">
    <svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg><span>Snakes &amp; Ladders</span>
  </a>
  <div class="bar-right">
    <button class="room-chip" id="roomChip" title="Room details" hidden><span class="dot"></span><span id="roomChipText"></span></button>
    <button class="icon-btn view-btn" id="btnView" aria-pressed="false">3D</button>
    <button class="icon-btn" id="btnSound" title="Sound on/off" aria-label="Toggle sound" aria-pressed="true">
      <svg class="ic on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="ic off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </div>
</header>
<main class="stage" id="stage">
  <div class="table" id="table" hidden>
    <div class="board-wrap" id="boardWrap"><canvas id="board" aria-label="Snakes and Ladders board. Press space to roll the dice."></canvas></div>
    <aside class="side">
      <div class="seats" id="seats"></div>
      <div class="dock">
        <button class="dice-btn" id="dice" aria-label="Roll the dice"><div class="cube-wrap"><div class="cube"></div></div></button>
        <div class="turn-msg" id="turnMsg" aria-live="polite"></div>
      </div>
    </aside>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="cards"></div>
</main>
<script src="../party/vendor/peerjs.min.js"></script>
<script src="../party/vendor/qrcode.js"></script>
<script src="../party/party.js"></script>
<script src="rules.js"></script>
<script src="game.js"></script>
</body>
</html>
